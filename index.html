<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বপ্ন ১৮ বছর পূর্তি উপহার</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Coding */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background: #f0f2f5; color: #333; }

        header { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { height: 40px; }
        
        .banner-container { width: 100%; display: flex; flex-direction: column; }
        .banner-container img { width: 100%; height: auto; border-bottom: 2px solid #e31e24; }
        
        .announcement { background: #e31e24; color: white; padding: 15px; text-align: center; font-weight: bold; }

        .card { background: white; margin: 20px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        
        .opt-btn { padding: 15px; background: #e31e24; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .opt-btn:active { transform: scale(0.95); }

        .live-winners { margin: 20px; background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .winner-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; font-size: 14px; }
        .winner-item span { color: green; font-weight: bold; }

        .share-section { display: none; }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Shwapno_logo.png" alt="Shwapno" class="logo">
        <div style="color: #e31e24; font-weight: bold;"><i class="fas fa-bars"></i></div>
    </header>

    <div class="banner-container">
        <img src="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200/5c7553102435423.5f3661be49e9d.jpg" alt="Gift Banner">
        <div class="announcement">স্বপ্ন ১৮ বছর পূর্তি উপলক্ষে সবাইকে ফ্রি উপহার দেওয়া হচ্ছে!</div>
    </div>

    <div id="main-area">
        <div id="quiz-area" class="card">
            <h3>আপনি কি ১৮ বছরের উপরে?</h3>
            <div class="options">
                <button onclick="nextQuestion()" class="opt-btn">হ্যাঁ</button>
                <button onclick="nextQuestion()" class="opt-btn">না</button>
            </div>
        </div>
    </div>

    <div class="live-winners">
        <h4 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">লাইভ বিজয়ীদের তালিকা</h4>
        <div id="winner-list"></div>
    </div>

    <script>
        // JavaScript Coding
        function nextQuestion() {
            const area = document.getElementById('quiz-area');
            area.innerHTML = `
                <h3 style="color: green;">অভিনন্দন!</h3>
                <p style="margin: 10px 0;">আপনি উপহার জেতার জন্য নির্বাচিত হয়েছেন। নিচের বাটনে ক্লিক করে হোয়াটসঅ্যাপে শেয়ার করুন এবং আপনার পুরস্কার বুঝে নিন।</p>
                <button onclick="finalStep()" class="opt-btn" style="background: #25D366;">
                    <i class="fab fa-whatsapp"></i> WhatsApp-এ শেয়ার করুন
                </button>
            `;
        }

        function finalStep() {
            window.open("whatsapp://send?text=স্বপ্ন ১৮ বছর পূর্তি উপলক্ষে সবাই টাকা পাচ্ছে! আপনিও চেষ্টা করুন: " + window.location.href);
            alert("কমপক্ষে ৫টি গ্রুপে শেয়ার করার পর পুরস্কারের ফর্মটি আসবে।");
        }

        // Live Winner Updates
        const names = ["Maruf", "Akash", "Sabbir", "Mitu", "Raihan", "Sumon"];
        const list = document.getElementById('winner-list');

        function addWinner() {
            const name = names[Math.floor(Math.random() * names.length)];
            const amount = [500, 1000, 2000, 5000][Math.floor(Math.random() * 4)];
            const div = document.createElement('div');
            div.className = 'winner-item';
            div.innerHTML = `<span>${name}***</span> kishui payechen <span>৳${amount}</span>`;
            
            if(list.children.length > 5) list.removeChild(list.lastChild);
            list.prepend(div);
        }

        setInterval(addWinner, 3000);
        addWinner(); // Initial call
    </script>
</body>
</html>
