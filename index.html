<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বপ্ন ১৮ বছর পূর্তি অফার</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background: #f0f2f5; color: #1c1e21; }

        /* হেডার */
        header { background: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e31e24; position: sticky; top: 0; z-index: 1000; }
        .logo { height: 40px; }

        /* পপ-আপ ডিজাইন */
        #popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-card { background: #fff; width: 90%; max-width: 380px; border-radius: 15px; text-align: center; padding: 25px; border-top: 8px solid #e31e24; }
        .popup-card h2 { color: #e31e24; margin-bottom: 10px; font-size: 24px; }
        .popup-btn { background: #e31e24; color: #fff; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }

        /* ব্যানার */
        .banner { width: 100%; border-bottom: 3px solid #e31e24; }
        .banner img { width: 100%; display: block; }

        /* কুইজ সেকশন */
        .card { background: #fff; margin: 15px; padding: 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .card h3 { font-size: 18px; margin-bottom: 15px; text-align: center; }
        .btn-box { display: flex; gap: 10px; }
        .opt-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #e31e24; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* রিয়েল ফেসবুক স্টাইল কমেন্ট */
        .comment-section { background: #fff; margin: 15px; padding: 15px; border-radius: 8px; }
        .comment-section h4 { border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; font-size: 15px; color: #606770; }
        .comment { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #f0f2f5; padding-bottom: 10px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
        .comment-body { background: #f0f2f5; padding: 10px 15px; border-radius: 18px; flex: 1; }
        .comment-body b { font-size: 14px; display: block; margin-bottom: 2px; }
        .comment-body p { font-size: 14px; color: #1c1e21; line-height: 1.4; }
        .reward-tag { color: #28a745; font-weight: bold; font-size: 12px; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div id="popup">
        <div class="popup-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Shwapno_logo.png" style="width: 80px;">
            <h2>অভিনন্দন!</h2>
            <p>স্বপ্ন ১৮ বছর পূর্তি উপলক্ষে আপনি স্পেশাল গিফট জেতার সুযোগ পেয়েছেন।</p>
            <button class="popup-btn" onclick="closePopup()">উপহার দেখুন</button>
        </div>
    </div>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Shwapno_logo.png" alt="Logo" class="logo">
        <i class="fas fa-search" style="color: #606770; font-size: 18px;"></i>
    </header>

    <div class="banner">
        <img src="https://i.ibb.co/Lkhm7G0/image-46c964.jpg" alt="Banner 1">
        <img src="https://i.ibb.co/vYd8y6M/image-46c980.jpg" alt="Banner 2">
    </div>

    <div class="card" id="quiz">
        <h3>আপনি কি ১৮ বছরের উপরে?</h3>
        <div class="btn-box">
            <button class="opt-btn" onclick="goShare()">হ্যাঁ</button>
            <button class="opt-btn" onclick="goShare()">না</button>
        </div>
    </div>

    <div class="comment-section">
        <h4>সাম্প্রতিক বিজয়ীদের মন্তব্য</h4>
        <div id="comment-list">
            </div>
    </div>

    <script>
        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        function goShare() {
            document.getElementById('quiz').innerHTML = `
                <h2 style="color:#28a745; text-align:center;">আপনি ২৫০০৳ বোনাস পেয়েছেন!</h2>
                <p style="text-align:center; margin:10px 0;">টাকাটি সরাসরি বিকাশ বা নগদে নিতে নিচের বাটনে ক্লিক করে শেয়ার সম্পন্ন করুন।</p>
                <button onclick="whatsappShare()" class="opt-btn" style="background:#25D366; width:100%;">
                    <i class="fab fa-whatsapp"></i> WhatsApp-এ শেয়ার করুন
                </button>
            `;
        }

        function whatsappShare() {
            window.open("whatsapp://send?text=স্বপ্নের ১৮ বছর পূর্তি উপলক্ষে সবাই টাকা পাচ্ছে! আমি পেলাম ২৫০০ টাকা। আপনিও নিন: " + window.location.href);
            alert("কমপক্ষে ১০ বার শেয়ার করার পর পেমেন্ট ফর্মটি ওপেন হবে।");
        }

        const fbComments = [
            { name: "Sabbir Ahmed", text: "অসাধারণ! আমি ১০ মিনিট আগে ৫০০ টাকা পেলাম।", color: "#4267B2", reward: "৳৫০০ পেয়েছে" },
            { name: "Sumaiya Akter", text: "প্রথমে বিশ্বাস হয়নি, কিন্তু শেয়ার করার পর টাকা পেয়েছি!", color: "#E1306C", reward: "৳১০০০ পেয়েছে" },
            { name: "Mehedi Hasan", text: "স্বপ্নের এই অফারটা সত্যি সেরা। ধন্যবাদ।", color: "#1DA1F2", reward: "৳২০০০ পেয়েছে" },
            { name: "Rifat Khan", text: "আমি কি আবারও পাবো? একবার পেয়েছি।", color: "#0088cc", reward: "৳৫০০ পেয়েছে" }
        ];

        function loadComments() {
            const list = document.getElementById('comment-list');
            fbComments.forEach(c => {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `
                    <div class="avatar" style="background:${c.color}">${c.name[0]}</div>
                    <div class="comment-body">
                        <b>${c.name}</b>
                        <p>${c.text}</p>
                        <span class="reward-tag"><i class="fas fa-check-circle"></i> ${c.reward}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        loadComments();
    </script>
</body>
</html>
