<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shwapno Anniversary Gift</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar - Shwapno Color */
        .header {
            background-color: #ed1c24; /* Red color like Shwapno */
            width: 100%;
            padding: 15px 0;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 450px;
            width: 90%;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .offer-image {
            width: 100%;
            height: 200px;
            background-color: #ffebee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #ed1c24;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #ed1c24;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Login Form */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .claim-btn {
            width: 100%;
            background-color: #ed1c24;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="header">
        SHWAPNO 🛒
    </div>

    <div class="container">
        <div class="offer-image">
            🎁 ১৮ বছর পূর্তি উপলক্ষে <br> বিশেষ উপহার!
        </div>
        <div class="content">
            <h2>আপনার উপহারটি বুঝে নিন</h2>
            <p>নিচের বক্সে আপনার তথ্য দিয়ে লগইন করে গিফটটি ক্লেইম করুন।</p>
            
            <form action="#">
                <input type="text" placeholder="মোবাইল নম্বর বা ইমেইল" required>
                <input type="password" placeholder="পাসওয়ার্ড" required>
                <button type="submit" class="claim-btn">উপহার নিন (Claim Now)</button>
            </form>
        </div>
    </div>

    <div class="footer">
        © 2026 Shwapno Online Service
    </div>

</body>
</html>
